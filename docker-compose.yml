# ============================================
# 🐳 Docker Compose — TradeBot
# ============================================

services:
  # ----------------------------------------
  # Interactive console (the app)
  # Run with: docker compose run --rm tradebot
  # ----------------------------------------
  tradebot:
    build:
      context: .
      target: production
    container_name: tradebot
    stdin_open: true   # keep STDIN open for the REPL
    tty: true          # allocate a TTY
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data   # persist watchlist / portfolios / journal
    depends_on:
      - ollama

  # ----------------------------------------
  # Test suite
  # ----------------------------------------
  test:
    build:
      context: .
      target: production
    container_name: tradebot-test
    entrypoint: ["python", "-m", "pytest", "tests/", "-v"]
    volumes:
      - ./tests:/app/tests:ro

  # ----------------------------------------
  # Ollama — local AI server (optional)
  # ----------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: tradebot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
